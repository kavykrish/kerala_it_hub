name: Build Android APK

# Builds the Kivy app in android_app/ into a debug APK using Buildozer,
# entirely in the cloud -- no local Linux/WSL setup required.
#
# Buildozer itself is installed directly on the runner (not via a
# third-party container action) so the build doesn't depend on someone
# else's Docker image staying maintained.
#
# Trigger manually from the Actions tab ("Run workflow"), or automatically
# whenever android_app/ changes on main.
#
# The finished APK is attached to the workflow run as a downloadable
# artifact (Actions tab -> this run -> Artifacts).

on:
  push:
    branches: [main]
    paths:
      - "android_app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The Android Gradle Plugin requires Java 17, but the runner's
      # default JAVA_HOME points at Java 11 -- ubuntu-22.04 runners
      # already ship a Temurin 17 JDK (JAVA_HOME_17_X64), so just point
      # at that instead of installing a redundant one via apt.
      - name: Select Java 17 for the Android Gradle Plugin
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev build-essential

      - name: Install Buildozer and Cython
        run: pip install --upgrade buildozer==1.5.0 cython==0.29.36

      # v2: earlier failed runs left a half-built (corrupted) venv/build
      # tree cached under the "buildozer-*-" prefix, and restore-keys
      # kept resurrecting it via fuzzy prefix match even after the exact
      # key changed, causing bizarre pip ImportErrors. Bumping the key
      # prefix forces a clean rebuild once; delete the old "buildozer-*"
      # (no "-v2-") entries from the repo's Actions cache settings if
      # you want to reclaim the storage.
      - name: Cache Buildozer global downloads (Android SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v2-${{ hashFiles('android_app/buildozer.spec') }}
          restore-keys: buildozer-global-v2-

      - name: Cache Buildozer app build directory
        uses: actions/cache@v4
        with:
          path: android_app/.buildozer
          key: buildozer-app-v2-${{ hashFiles('android_app/buildozer.spec') }}
          restore-keys: buildozer-app-v2-

      # Gradle auto-generates ~/.android/debug.keystore if it's missing,
      # with a fresh random key every time. Since that path was never
      # cached, every CI run signed the APK with a *different* debug
      # key -- Android then refuses to install a new build over an
      # existing one, since an in-place update requires a matching
      # signature. Cache it under a fixed key (no buildozer.spec hash)
      # so it's created once and reused by every future run, keeping
      # every debug APK we ever build mutually upgradable.
      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate Android debug keystore if missing
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        working-directory: android_app
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kerala-it-hub-debug-apk
          path: android_app/bin/*.apk
