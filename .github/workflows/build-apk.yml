name: Build Android APK

# Builds the Kivy app in android_app/ into a debug APK using Buildozer,
# entirely in the cloud -- no local Linux/WSL setup required.
#
# Buildozer itself is installed directly on the runner (not via a
# third-party container action) so the build doesn't depend on someone
# else's Docker image staying maintained.
#
# Trigger manually from the Actions tab ("Run workflow"), or automatically
# whenever android_app/ changes on main.
#
# The finished APK is attached to the workflow run as a downloadable
# artifact (Actions tab -> this run -> Artifacts).

on:
  push:
    branches: [main]
    paths:
      - "android_app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04

    # Needed to create/update the GitHub Release below -- the default
    # GITHUB_TOKEN only has read access to repo contents otherwise.
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The Android Gradle Plugin requires Java 17, but the runner's
      # default JAVA_HOME points at Java 11 -- ubuntu-22.04 runners
      # already ship a Temurin 17 JDK (JAVA_HOME_17_X64), so just point
      # at that instead of installing a redundant one via apt.
      - name: Select Java 17 for the Android Gradle Plugin
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev build-essential

      - name: Install Buildozer and Cython
        run: pip install --upgrade buildozer==1.5.0 cython==0.29.36

      # v2: earlier failed runs left a half-built (corrupted) venv/build
      # tree cached under the "buildozer-*-" prefix, and restore-keys
      # kept resurrecting it via fuzzy prefix match even after the exact
      # key changed, causing bizarre pip ImportErrors. Bumping the key
      # prefix forces a clean rebuild once; delete the old "buildozer-*"
      # (no "-v2-") entries from the repo's Actions cache settings if
      # you want to reclaim the storage.
      - name: Cache Buildozer global downloads (Android SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v2-${{ hashFiles('android_app/buildozer.spec') }}
          restore-keys: buildozer-global-v2-

      - name: Cache Buildozer app build directory
        uses: actions/cache@v4
        with:
          path: android_app/.buildozer
          key: buildozer-app-v2-${{ hashFiles('android_app/buildozer.spec') }}
          restore-keys: buildozer-app-v2-

      # Gradle auto-generates ~/.android/debug.keystore if it's missing,
      # with a fresh random key every time. Since that path was never
      # cached, every CI run signed the APK with a *different* debug
      # key -- Android then refuses to install a new build over an
      # existing one, since an in-place update requires a matching
      # signature. Cache it under a fixed key (no buildozer.spec hash)
      # so it's created once and reused by every future run, keeping
      # every debug APK we ever build mutually upgradable.
      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate Android debug keystore if missing
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        working-directory: android_app
        run: buildozer -v android debug

      # buildozer never passes a --keystore to p4a for debug builds, so
      # the actual signing key comes from wherever Gradle/AGP's own
      # internal default-debug-signing logic decides on -- and in this
      # p4a/AGP combination that isn't reliably our cached
      # ~/.android/debug.keystore: two APKs built minutes apart, each
      # after a reported cache *hit* on that exact file, still came out
      # byte-for-byte differently signed (confirmed by extracting and
      # diffing both certificates). Trusting that path is a dead end,
      # so explicitly re-sign the finished APK ourselves with our own
      # stable keystore, bypassing whatever Gradle/AGP did internally.
      - name: Re-sign APK with the stable debug keystore
        run: |
          set -e
          BUILD_TOOLS_DIR=$(find ~/.buildozer/android/platform/android-sdk/build-tools -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          APK=$(find android_app/bin -maxdepth 1 -name '*.apk' | head -1)
          echo "Re-signing $APK with $APKSIGNER"
          "$APKSIGNER" sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            "$APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kerala-it-hub-debug-apk
          path: android_app/bin/*.apk

      # Actions artifacts (the step above) require a GitHub login to
      # download, which is awkward for sharing an installable APK
      # with someone who doesn't have -- or shouldn't need -- repo
      # access. A Release asset is a normal public URL anyone can
      # download directly. Reuses the same v1.0.0 tag/link every run
      # (via --clobber) so a link shared once keeps working and
      # always serves the latest build, rather than a new URL per
      # version.
      - name: Publish latest build as a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(find android_app/bin -maxdepth 1 -name '*.apk' | head -1)
          cp "$APK" KeralaITHub.apk
          NOTES_FILE=$(mktemp)
          {
            echo "Auto-updated build from commit ${GITHUB_SHA::7}, $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo ""
            echo 'Download KeralaITHub.apk below, open it on your phone, and allow "install from unknown sources" when prompted (this is a debug build, not from the Play Store).'
            echo ""
            echo "After installing, open the app -> Settings -> and make sure the backend URL is set to https://kerala-it-hub-api.onrender.com"
          } > "$NOTES_FILE"
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 KeralaITHub.apk --clobber
            gh release edit v1.0.0 --notes-file "$NOTES_FILE"
          else
            gh release create v1.0.0 KeralaITHub.apk --title "Kerala IT Hub" --notes-file "$NOTES_FILE"
          fi
