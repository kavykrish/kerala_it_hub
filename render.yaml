services:
  - type: web
    name: kerala-it-hub-api
    env: python
    plan: free
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python -c "from web_retrieval.embedding_model import load_embedding_model; load_embedding_model()"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.0
